<!doctype html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="favicon/favicon.ico" />
    <link
      type="text/css"
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/FortAwesome/Font-Awesome@7.x/css/all.min.css"
    />
    <link type="text/css" rel="stylesheet" href="src/styles/main.css" />
    <title>Tree Visualization Template</title>
  </head>

  <body>
    <div class="blob blob--1"></div>
    <div class="blob blob--2"></div>
    <div class="blob blob--3"></div>
    <div id="body"></div>
    <div id="tooltip" class="tooltip" style="opacity: 0"></div>

    <div id="legend" class="legend" aria-hidden="true">
      <table width="100%" border="0">
        <tr>
          <td align="center">(D)</td>
          <td>
            <i
              class="fab fa-google"
              style="color: var(--accent-2)"
              aria-hidden="true"
            ></i>
            &nbsp; Google Dork, for more information:
            <a
              href="https://en.wikipedia.org/wiki/Google_hacking"
              target="_blank"
              rel="noopener noreferrer"
              >Google Hacking</a
            >
          </td>
        </tr>
        <tr>
          <td align="center">(R)</td>
          <td>
            <i
              class="fas fa-users"
              style="color: var(--accent-2)"
              aria-hidden="true"
            ></i>
            &nbsp; Requires registration
          </td>
        </tr>
        <tr>
          <td align="center">(M)</td>
          <td>
            <i
              class="fas fa-link"
              style="color: var(--accent-2)"
              aria-hidden="true"
            ></i>
            &nbsp; Provides URL with a search query
          </td>
        </tr>
        <tr>
          <td align="center">(T)</td>
          <td>
            <i
              class="fas fa-tools"
              style="color: var(--accent-2)"
              aria-hidden="true"
            ></i>
            &nbsp; The tool has to be set up on a local device
          </td>
        </tr>
      </table>
    </div>

    <div class="btn-group">
      <button
        id="legend-btn"
        class="pill-btn"
        type="button"
        aria-controls="legend"
        aria-expanded="false"
      >
        <i class="fas fa-info-circle" aria-hidden="true"></i>
        <span class="pill-btn__label">Legend</span>
      </button>
      <button id="mode-btn" class="pill-btn" type="button" aria-pressed="false">
        <i class="fas fa-bullseye" aria-hidden="true"></i>
        <span class="pill-btn__label">Focus</span>
      </button>
    </div>

    <svg width="0" height="0" style="position: absolute">
      <filter id="neon-glow" x="-100%" y="-100%" width="300%" height="300%">
        <feGaussianBlur stdDeviation="3" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
      <filter
        id="neon-glow-pulse"
        x="-100%"
        y="-100%"
        width="300%"
        height="300%"
      >
        <feGaussianBlur stdDeviation="6" result="blur">
          <animate
            attributeName="stdDeviation"
            values="4;8;4"
            dur="2.4s"
            repeatCount="indefinite"
          />
        </feGaussianBlur>
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
      <filter id="mist-dissolve" x="-50%" y="-50%" width="200%" height="200%">
        <feTurbulence
          type="fractalNoise"
          baseFrequency="0"
          numOctaves="2"
          result="noise"
          id="mist-turb"
        />
        <feDisplacementMap
          in="SourceGraphic"
          in2="noise"
          scale="0"
          xChannelSelector="R"
          yChannelSelector="G"
          id="mist-disp"
        />
      </filter>
    </svg>

    <div class="controls-overlay" style="display: none">
      <label class="search-box" for="search-input">
        <i class="fas fa-search" aria-hidden="true"></i>
        <input
          type="text"
          id="search-input"
          placeholder="Search nodes..."
          aria-label="Search tree nodes"
        />
      </label>
      <button id="reset-btn" class="pill-btn" type="button">
        <i class="fas fa-crosshairs" aria-hidden="true"></i>
        <span class="pill-btn__label">Center</span>
      </button>
    </div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
